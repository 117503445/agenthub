name: release

on:
  push:
    branches:
      - "**"
    tags:
      - "**"
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-release:
    name: build release
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 生成发布参数
        id: vars
        shell: bash
        run: |
          set -euo pipefail

          short_sha="${GITHUB_SHA::12}"
          build_time="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          git_branch="${GITHUB_REF_NAME}"
          git_tag=""
          safe_ref="$(printf '%s' "${GITHUB_REF_NAME}" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9._-]/-/g; s/--*/-/g; s/^-//; s/-$//')"
          if [[ -z "${safe_ref}" ]]; then
            safe_ref="branch"
          fi
          release_tag="${safe_ref}-${short_sha}"
          release_name="AgentHub ${GITHUB_REF_NAME} ${short_sha}"
          release_target="${GITHUB_SHA}"
          prerelease="true"
          make_latest="false"

          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            git_tag="${GITHUB_REF_NAME}"
            release_tag="${GITHUB_REF_NAME}"
            release_name="AgentHub ${GITHUB_REF_NAME}"
            prerelease="false"
            make_latest="true"
          fi

          {
            echo "short_sha=${short_sha}"
            echo "build_time=${build_time}"
            echo "git_branch=${git_branch}"
            echo "git_tag=${git_tag}"
            echo "git_version=${release_tag}"
            echo "release_tag=${release_tag}"
            echo "release_name=${release_name}"
            echo "release_target=${release_target}"
            echo "prerelease=${prerelease}"
            echo "make_latest=${make_latest}"
          } >> "${GITHUB_OUTPUT}"

      - name: 配置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 构建发布二进制
        uses: docker/build-push-action@v6
        with:
          context: .
          file: scripts/docker/release.Dockerfile
          target: artifacts
          platforms: linux/amd64
          outputs: type=local,dest=dist
          build-args: |
            BUILD_TIME=${{ steps.vars.outputs.build_time }}
            GIT_BRANCH=${{ steps.vars.outputs.git_branch }}
            GIT_COMMIT=${{ github.sha }}
            GIT_DIRTY=false
            GIT_TAG=${{ steps.vars.outputs.git_tag }}
            GIT_VERSION=${{ steps.vars.outputs.git_version }}
          cache-from: type=gha,scope=agenthub-release
          cache-to: type=gha,scope=agenthub-release,mode=max

      - name: 上传工作流产物
        uses: actions/upload-artifact@v4
        with:
          name: agenthub-release-${{ steps.vars.outputs.short_sha }}
          path: |
            dist/*
            install.sh
          if-no-files-found: error

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 生成镜像元数据
        id: image_meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,format=long,prefix=
            type=ref,event=branch
            type=ref,event=tag

      - name: 构建并发布 Linux 双架构镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          file: scripts/docker/release.Dockerfile
          target: runtime
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.image_meta.outputs.tags }}
          labels: ${{ steps.image_meta.outputs.labels }}
          build-args: |
            BUILD_TIME=${{ steps.vars.outputs.build_time }}
            GIT_BRANCH=${{ steps.vars.outputs.git_branch }}
            GIT_COMMIT=${{ github.sha }}
            GIT_DIRTY=false
            GIT_TAG=${{ steps.vars.outputs.git_tag }}
            GIT_VERSION=${{ steps.vars.outputs.git_version }}
          cache-from: type=gha,scope=agenthub-release
          cache-to: type=gha,scope=agenthub-release,mode=max

      - name: 发布 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.release_tag }}
          target_commitish: ${{ steps.vars.outputs.release_target }}
          name: ${{ steps.vars.outputs.release_name }}
          prerelease: ${{ steps.vars.outputs.prerelease }}
          make_latest: ${{ steps.vars.outputs.make_latest }}
          files: |
            dist/*
            install.sh
          fail_on_unmatched_files: true
          body: |
            自动构建提交 `${{ github.sha }}`。

            包含 Linux 和 macOS 的 amd64、arm64 二进制、SHA256SUMS 校验文件，以及 install.sh 安装脚本。
