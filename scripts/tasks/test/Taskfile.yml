version: 3

tasks:
  ut:
    desc: "运行单元测试"
    cmds:
      - go run ./scripts/go-scripts ut

  it:
    desc: "运行集成测试"
    deps:
      - ":fe:build"
    cmds:
      - go run ./scripts/go-scripts it

  e2e:
    desc: "运行 E2E 测试"
    cmds:
      - task: :e2e:all

  all:
    desc: "运行所有测试"
    cmds:
      - task: :test:ut
      - task: :test:it
      - task: :test:e2e
