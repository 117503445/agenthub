version: 3

tasks:
  ut:
    desc: "运行单元测试"
    cmds:
      - go run ./scripts/go-scripts ut

  it:
    desc: "运行集成测试"
    deps:
      - ":fe:build"
    cmds:
      - go run ./scripts/go-scripts it

  all:
    desc: "运行所有测试"
    cmds:
      - task: :test:ut
      - task: :test:it
      - task: :e2e:all
