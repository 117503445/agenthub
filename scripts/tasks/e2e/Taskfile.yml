version: 3

tasks:
  install:
    desc: "安装 E2E 依赖和浏览器"
    dir: ./scripts/e2e
    cmds:
      - uv sync
      - uv run playwright install chromium

  all:
    desc: "运行全部 E2E 测试"
    deps: [":build:web"]
    dir: ./scripts/e2e
    cmds:
      - uv run main.py {{.CLI_ARGS}}

  run:
    desc: "运行全部 E2E 测试"
    deps: [":e2e:all"]

  case:
    desc: "运行指定 E2E 用例"
    deps: [":build:web"]
    dir: ./scripts/e2e
    cmds:
      - uv run main.py --case {{.CLI_ARGS}}
