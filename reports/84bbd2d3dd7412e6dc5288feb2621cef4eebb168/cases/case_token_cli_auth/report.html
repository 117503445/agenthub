<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AgentHub E2E 用例报告</title>
<style>
:root{color-scheme:light;--bg:#f6f7f9;--panel:#fff;--text:#202124;--muted:#5f6368;--line:#dde1e6;--ok:#137333;--bad:#b3261e;--link:#0b57d0}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}main{max-width:1080px;margin:0 auto;padding:32px 20px 56px}.eyebrow{margin:0 0 6px;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.08em}h1{margin:0 0 20px;font-size:28px;line-height:1.25}h2{margin:28px 0 12px;font-size:18px}.meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin:0 0 24px}.meta div,table,.markdown{background:var(--panel);border:1px solid var(--line);border-radius:8px}.meta div{padding:14px}.meta span{display:block;color:var(--muted);font-size:12px}.meta strong,.meta code{display:block;margin-top:4px;word-break:break-all}table{width:100%;border-collapse:collapse;overflow:hidden}th,td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:left}tr:last-child td{border-bottom:0}.status{font-weight:700}.status.passed{color:var(--ok)}.status.failed{color:var(--bad)}a{color:var(--link);text-decoration:none}a:hover{text-decoration:underline}code{font-family:"SFMono-Regular",Consolas,monospace}.markdown{padding:22px}.markdown h1{font-size:24px}.markdown p{margin:8px 0}.bullet{padding-left:4px}figure{margin:18px 0}img{max-width:100%;border:1px solid var(--line);border-radius:6px;background:#fff}figcaption{margin-top:6px;color:var(--muted);font-size:12px}
</style>
</head>
<body>
<main class="markdown">
<h1>Token 鉴权 E2E 测试报告</h1>
<br>
<p class="bullet">• 结果: 通过</p>
<p class="bullet">• 日志: <a href="logs/test.log">test.log</a></p>
<p class="bullet">• 服务日志: <a href="logs/server.log">server.log</a></p>
<br>
<h2>过程</h2>
<br>
<p class="bullet">• AGENTHUB_TOKEN 非空时，前端先展示 token 输入界面，不连接工作台。</p>
<br>
<figure><img src="screenshots/01-token-required.png" alt="需要 Token"><figcaption>需要 Token</figcaption></figure>
<br>
<p class="bullet">• 输入错误 token 时，前端保持在 token 输入界面，且不会持久化错误 token。</p>
<p class="bullet">• 输入正确 token 后，前端连接 WebSocket 并只把 AGENTHUB_TOKEN 写入持久化状态。</p>
<br>
<figure><img src="screenshots/02-authenticated.png" alt="鉴权通过"><figcaption>鉴权通过</figcaption></figure>
<br>
<p class="bullet">• 刷新页面后，前端复用已储存的 AGENTHUB_TOKEN，不再储存其它状态。</p>
<br>
</main>

</body>
</html>
